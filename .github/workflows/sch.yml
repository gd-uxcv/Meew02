name: Run Feed Processor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-processor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: feed-processor
      cancel-in-progress: false
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          path: public-repo
          fetch-depth: 0

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-repo
          lfs: true

      - name: Verify private repo files
        run: |
          echo "=== Workspace ==="
          pwd
          echo "=== private-repo contents ==="
          ls -lah private-repo/
          echo "=== APK check ==="
          file private-repo/dudetv_3.2v.apk || echo "APK NOT FOUND"
          echo "=== Python script check ==="
          ls -lah private-repo/fetch_and_decrypt.py || echo "SCRIPT NOT FOUND"
          echo "=== requirements check ==="
          ls -lah private-repo/requirements.txt || echo "REQ NOT FOUND"

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: private-repo/requirements.txt

      - name: Install Dependencies
        working-directory: private-repo
        run: |
          pip install -r requirements.txt
          python -c "import Crypto; print('pycryptodome OK')"
          python -c "import frida; print('frida OK')" || echo "frida not importable"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator and Decrypt
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "5"
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot-save
          script: |
            set -e
            cd "$GITHUB_WORKSPACE/private-repo"
            echo "=== Working dir ==="
            pwd
            ls -lah
            adb shell wm dismiss-keyguard
            echo "=== Installing APK ==="
            adb install -g dudetv_3.2v.apk
            adb shell pm grant com.sportzx.live android.permission.POST_NOTIFICATIONS || true
            export OUTPUT_DIR="$GITHUB_WORKSPACE/public-repo"
            echo "=== Running Python ==="
            python fetch_and_decrypt.py

      - name: Commit and Push output.json
        working-directory: public-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update output.json [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push failed, retrying ($i/5)..."
            git pull --rebase origin main
            sleep 5
          done
          exit 1
